  Object.values(sel).forEach(a => { const b = bill(a.billId); if (b && !keys.has(a.billId + '|' + a.month)) cands.push({key: a.billId + '|' + a.month, b, m: a.month, due: dueFromKey(b, a.month), label: ''}); });
  const shown = cands.filter(c => sel[c.key] || c.suggest || (PCall && c.near));
  const hiddenCount = cands.filter(c => c.near && !shown.includes(c)).length;
  const customs = PC.allocations.filter(a => a.type === 'custom');
  const nextPay = addDays(PC.payDate || todayStr(), 7);
  modal(`
    <h2>${PC.id ? 'Paycheck' : 'New paycheck'}</h2>
    <div class="grid2">
      <div><label>Pay date</label><input id="pcDate" type="date" value="${PC.payDate}" onchange="syncPc();drawPc()"></div>
      <div><label>Take-home amount</label><input id="pcAmt" type="number" step="0.01" inputmode="decimal" value="${PC.amount || ''}" placeholder="0.00" oninput="syncPc()"></div>
    </div>
    <label>Note</label><input id="pcNote" value="${esc(PC.note)}" placeholder="Optional — e.g. overtime, bonus" oninput="syncPc()">
    <div class="pcsum" id="pcSum"></div>
    <h3>Bills from this check</h3>
    <div class="small muted">Suggested: anything due ${fmtDate(PC.payDate)} – ${fmtDate(addDays(nextPay, -1))} (before next payday) plus overdue bills.</div>
    ${shown.map(c => `<div class="pcrow"><input type="checkbox" data-k="${c.key}" ${sel[c.key] ? 'checked' : ''} onchange="syncPc()">
      <div class="info lbl">${esc(c.b.name)}<br><small>Due ${fmtDay(c.due)}${c.label ? ' · ' + c.label : ''}</small></div>
      <input class="amtin" type="number" step="0.01" inputmode="decimal" data-ka="${c.key}" value="${sel[c.key] ? sel[c.key].amount : c.b.amount}" oninput="syncPc()"></div>`).join('')
      || '<div class="small muted" style="padding:10px 0">No bills due this week. 🎉</div>'}
    ${!PCall && hiddenCount ? `<button class="btn ghost block" style="margin-top:8px" onclick="syncPc();PCall=true;drawPc()">Show ${hiddenCount} more upcoming bill${hiddenCount > 1 ? 's' : ''}</button>` : ''}
    <h3>Other spending</h3>
    ${customs.map((a, i) => `<div class="pcrow"><input class="lbl" data-cl="${i}" value="${esc(a.label)}" placeholder="What for?" oninput="syncPc()">
      <input class="amtin" type="number" step="0.01" inputmode="decimal" data-ca="${i}" value="${a.amount}" placeholder="0.00" oninput="syncPc()">
      <button class="xbtn" onclick="removeCustom(${i})">×</button></div>`).join('')}
    <div class="chips">${['Groceries','Gas','Savings','Spending money','Kids','Eating out'].map(l => `<button class="chip" onclick="addCustom('${l}')">+ ${l}</button>`).join('')}<button class="chip" onclick="addCustom('')">+ Other</button></div>
    <div class="row"><button class="btn ghost" onclick="goBack()">Cancel</button><button class="btn primary" onclick="savePc(false)">Save</button></div>
    <button class="btn green block" style="margin-top:8px" onclick="savePc(true)">Save & mark checked bills paid</button>
    ${PC.id ? `<button class="btn danger block" style="margin-top:8px" onclick="deletePc()">Delete paycheck</button>` : ''}`);
  updatePcSum();
}

function syncPc() {
  if (!$('pcDate')) return;
  PC.payDate = val('pcDate') || todayStr(); PC.amount = num(val('pcAmt')); PC.note = val('pcNote').trim();
  const q = sel => [...document.querySelectorAll('#overlay ' + sel)];
  const onScreen = new Set(q('[data-k]').map(el => el.dataset.k));
  const bills = PC.allocations.filter(a => a.type === 'bill' && !onScreen.has(a.billId + '|' + a.month));
  q('[data-k]').forEach(el => {
    if (!el.checked) return;
    const [billId, month] = el.dataset.k.split('|');
    const amtEl = document.querySelector(`#overlay [data-ka="${el.dataset.k}"]`);
    bills.push({type: 'bill', billId, month, amount: num(amtEl && amtEl.value)});
  });
  const customs = q('[data-cl]').map(el => ({type: 'custom', label: el.value.trim(), amount: num((document.querySelector(`#overlay [data-ca="${el.dataset.cl}"]`) || {}).value)}));
  PC.allocations = bills.concat(customs);
  updatePcSum();
}
function updatePcSum() {
  const {planned, left} = pcTotals(PC), el = $('pcSum'); if (!el) return;
  el.innerHTML = `<div class="eq"><div><b>${money(PC.amount)}</b><span>Paycheck</span></div><div><b>− ${money(planned)}</b><span>Planned</span></div>
    <div><b style="color:${left < 0 ? 'var(--red)' : 'var(--green)'}">${money(left)}</b><span>Left over</span></div></div>
    ${left < 0 ? `<div class="small" style="color:var(--red);text-align:center;margin-top:6px">⚠️ You're short ${money(-left)} — uncheck something or move it to next week.</div>` : ''}`;
}
function addCustom(label) {
  syncPc(); PC.allocations.push({type: 'custom', label, amount: ''}); drawPc();
  const els = document.querySelectorAll('#overlay [data-ca]'), last = els[els.length - 1];
  if (last) setTimeout(() => { const el = label ? last : document.querySelector(`#overlay [data-cl="${last.dataset.ca}"]`); if (el) el.focus(); }, 250);
}
function removeCustom(i) {
  syncPc(); let n = -1;
  PC.allocations = PC.allocations.filter(a => a.type !== 'custom' || ++n !== i); drawPc();
}
function savePc(andPay) {
  syncPc();
  PC.allocations = PC.allocations.filter(a => a.type === 'bill' || a.label || num(a.amount));
  const pc = JSON.parse(JSON.stringify(PC)), recs = andPay ? allocRecs(pc) : [];
  const orig = pc.id ? myPaychecks().find(p => p.id === pc.id) : null;
  const removedPaid = orig ? orig.allocations.filter(a => a.type === 'bill' && allocPaid(a) &&
    !pc.allocations.some(x => x.type === 'bill' && x.billId === a.billId && x.month === a.month)) : [];
  closeModal();
  if (removedPaid.length) setTimeout(() => askUnpay(removedPaid), 600);
  mutate('savePaycheck', [pc], () => {
    if (pc.id) S.paychecks = S.paychecks.map(p => p.id === pc.id ? pc : p); else S.paychecks.push(Object.assign({}, pc, {id: 'tmp' + Date.now()}));
  }).then(() => { if (recs.length) return mutate('markPaidBatch', [recs]); });
  const left = pcTotals(pc).left;
  toast(recs.length ? `✅ Saved · ${recs.length} bill${recs.length > 1 ? 's' : ''} marked paid` : `💵 Saved · ${money(left)} left over`);
}
function askUnpay(list) {
  const names = list.map(a => esc((bill(a.billId) || {}).name || 'Bill')).join(', ');
  window._unpayList = list.map(a => ({billId: a.billId, month: a.month}));
  modal(`<h2>Also mark ${list.length > 1 ? 'them' : 'it'} unpaid?</h2>
    <p class="muted">You took <b>${names}</b> off this paycheck, but ${list.length > 1 ? "they're" : "it's"} still marked paid on your Bills screen.</p>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Keep paid</button>
    <button class="btn primary" onclick="closeModal();mutate('unmarkPaidBatch',[window._unpayList],()=>{S.payments=S.payments.filter(p=>!window._unpayList.some(x=>x.billId===p.billId&&x.month===p.month))});toast('Marked unpaid')">Mark unpaid</button></div>`);
}
function deletePc() {
  NEXT_BACK = drawPc;
  modal(`<h2>Delete this paycheck?</h2><p class="muted">Your bills and payments stay — this only removes the paycheck plan.</p>
    <div class="row"><button class="btn ghost" onclick="drawPc()">Cancel</button><button class="btn danger" onclick="doDeletePc()">Delete</button></div>`);
}
function doDeletePc() { const id = PC.id; closeModal(); mutate('deletePaycheck', [id], () => { S.paychecks = S.paychecks.filter(p => p.id !== id); }); toast('Paycheck deleted'); }

/* ============ Debts tab ============ */
function renderDebts() {
  const debts = S.bills.filter(b => b.trackBalance).sort((a, b) => b.balance - a.balance);
  const total = debts.reduce((s, b) => s + b.balance, 0), orig = debts.reduce((s, b) => s + (b.originalBalance || b.balance), 0);
  const pct = orig ? Math.max(0, Math.round((1 - total / orig) * 100)) : 0;
  const monthly = debts.filter(b => b.active).reduce((s, b) => s + (b.amount || b.minPayment), 0);
  return `<h1 style="margin-bottom:12px">Debts & balances</h1>
  ${debts.length ? `
  <div class="card summary"><div class="muted small">Total owed</div><div class="big">${money(total)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="small muted" style="margin-top:6px">${pct}% paid off of ${money(orig)} · ${money(monthly)}/mo going to debt</div></div>
  ${debts.map(b => {
    const p = b.originalBalance ? Math.max(0, Math.min(100, Math.round((1 - b.balance / b.originalBalance) * 100))) : 0;
    return `<div class="card debt" onclick="openDetail('${b.id}')" style="cursor:pointer">
      <div class="top"><b>${esc(b.name)}</b><span class="bal">${money(b.balance)}</span></div>
      <div class="bar"><i style="width:${p}%"></i></div>
      <div class="small muted" style="margin-top:6px">${p}% paid off${b.interestRate ? ' · ' + b.interestRate + '% APR' : ''}${b.minPayment ? ' · min ' + money(b.minPayment) : ''}</div>
      <div class="small" style="margin-top:4px">${payoff(b)}</div></div>`;
  }).join('')}
  ${debts.length > 1 ? `<div class="card small muted">💡 <b>Avalanche tip:</b> pay minimums on everything, then put extra toward the highest interest rate${(() => { const h = debts.filter(d => d.balance > 0).sort((a, b) => b.interestRate - a.interestRate)[0]; return h && h.interestRate ? ` — that's <b>${esc(h.name)}</b> (${h.interestRate}%)` : ''; })()}.</div>` : ''}`
  : `<div class="empty"><div class="e">📉</div><b>No balances tracked yet</b><br>Tap <b>+</b> to add a credit card or loan, or edit an existing bill and turn on “Track a balance”.</div>`}`;
}

/* ============ History tab ============ */
function renderHistory() {
  const months = []; for (let k = 11; k >= 0; k--) months.push(addM(curYM(), -k));
  const paidIn = m => S.payments.filter(p => p.month.slice(0, 7) === m && p.status !== 'skipped').reduce((s, p) => s + p.amount, 0);
  const vals = months.map(paidIn), max = Math.max(1, ...vals);
  const yr = String(new Date().getFullYear());
  const ytd = S.payments.filter(p => p.month.startsWith(yr) && p.status !== 'skipped').reduce((s, p) => s + p.amount, 0);
  const active = vals.filter(v => v > 0), avg = active.length ? active.reduce((a, b) => a + b, 0) / active.length : 0;

  const items = monthItems(S.ym).filter(i => i.status !== 'skipped'), cats = {};
  items.forEach(i => { const k = i.b.category || 'Uncategorized'; cats[k] = (cats[k] || 0) + i.amt; });
  const catTotal = Object.values(cats).reduce((a, b) => a + b, 0);
  const recent = S.payments.filter(p => p.status !== 'skipped').sort((a, b) => (b.paidDate || '').localeCompare(a.paidDate || '')).slice(0, 30);

  return `<h1 style="margin-bottom:12px">History</h1>
  <div class="card">
    <div class="stats" style="margin-top:0"><div class="stat"><b>${money(ytd)}</b><span>Paid in ${yr}</span></div>
    <div class="stat"><b>${money(avg)}</b><span>Monthly avg</span></div><div class="stat"><b>${money(paidIn(curYM()))}</b><span>This month</span></div></div>
    <div class="chart">${months.map((m, i) => `<div class="col ${m === curYM() ? 'cur' : ''}" onclick="S.ym='${m}';go('bills')" title="${monthLabel(m)}: ${money(vals[i])}">
      <i style="height:${Math.round(vals[i] / max * 100)}%"></i><span>${monthShort(m)}</span></div>`).join('')}</div>
    <div class="small muted" style="margin-top:6px">Tap a bar to open that month.</div>
  </div>
  <h3>Where it goes · ${monthLabel(S.ym)}</h3>
  <div class="card">${catTotal ? Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
    <div class="catrow"><div class="top"><span>${esc(k)}</span><span>${money(v)} <span class="muted small">${Math.round(v / catTotal * 100)}%</span></span></div>
    <div class="bar" style="margin-top:4px;height:6px"><i style="width:${v / catTotal * 100}%;background:var(--accent)"></i></div></div>`).join('') : '<div class="muted small">No bills this month.</div>'}</div>
  <h3>Recent payments</h3>
  <div class="card" style="padding:4px 14px">${recent.length ? recent.map(p => { const b = bill(p.billId) || {name: '(deleted)'};
    return `<div class="hist-item"><span>${esc(b.name)}<br><span class="small muted">${fmtDate(p.paidDate)}${p.confirmation ? ' · #' + esc(p.confirmation) : ''}</span></span><span>${money(p.amount)}</span></div>`; }).join('')
    : '<div class="muted small" style="padding:10px 0">No payments recorded yet.</div>'}</div>`;
}

/* ============ Settings tab ============ */
function renderSettings() {
  const s = S.settings;
  const hours = Array.from({length: 24}, (_, h) => `<option value="${h}" ${String(h) === String(s.reminderHour) ? 'selected' : ''}>${(h % 12 || 12) + (h < 12 ? ' AM' : ' PM')}</option>`).join('');
  return `<h1 style="margin-bottom:12px">Settings</h1>
  <div class="card">
    <div class="grid2">
      <div><label>Currency symbol</label><input id="sCur" value="${esc(s.currency)}" maxlength="3"></div>
      <div><label>${shared() ? 'Your monthly income' : 'Monthly income'}</label><input id="sInc" type="number" step="0.01" inputmode="decimal" value="${num(s.income) || ''}" placeholder="Optional"></div>
    </div>
    <div class="small muted" style="margin-top:6px">Add your income to see what's left after bills each month.</div>
    <label>“Due soon” means within</label>
    <select id="sDays">${[1,2,3,5,7,10,14].map(d => `<option value="${d}" ${String(d) === String(s.reminderDays) ? 'selected' : ''}>${d} day${d > 1 ? 's' : ''}</option>`).join('')}</select>
  </div>
  <h3>Appearance</h3>
  <div class="card">
    <div class="selwrap" style="display:block"><select class="filter" style="width:100%" onchange="setTheme(this.value)">
      ${[['light', '☀️ Light'], ['dark', '🌙 Dark'], ['auto', '📱 Match my phone']].map(([k, l]) => `<option value="${k}" ${getTheme() === k ? 'selected' : ''}>${l}</option>`).join('')}
    </select></div>
  </div>
  <h3>Categories</h3>
  <div class="card">
    <div class="small muted" style="margin-bottom:10px">These show up when you add a bill. Tap × to remove one (bills already using it keep it).</div>
    <div class="catpick">${savedCats().map((c, i) => `<button class="chip" onclick="removeCat(${i})">${esc(c)}<span class="x">×</span></button>`).join('') || '<span class="muted small">No saved categories.</span>'}</div>
    <div style="display:flex;gap:8px;margin-top:12px"><input id="newCat" placeholder="Add a category" onkeydown="if(event.key==='Enter')addCat()"><button class="btn primary" onclick="addCat()">Add</button></div>
  </div>
  <h3>Email reminders</h3>
  <div class="card">
    <label style="margin-top:0">Your email</label><input id="sMail" type="email" value="${esc(s.email || '')}" placeholder="you@example.com">
    <label class="check"><input type="checkbox" id="sEmail" ${String(s.emailReminders) === 'true' ? 'checked' : ''}> Email me about bills that are due soon or overdue</label>
    <label>Send at</label><select id="sHour">${hours}</select>
    <label class="check"><input type="checkbox" id="sSkipAuto" ${String(s.skipAutopayReminders) === 'true' ? 'checked' : ''}> Don't remind me about autopay bills (unless overdue)</label>
    <button class="btn ghost block" onclick="testEmail()">Send me a test email</button>
  </div>
  <button class="btn primary block" onclick="saveSettings()">Save settings</button>
  ${S.me.admin ? peopleCard() : ''}
  <h3>Account</h3>
  <div class="card">
    <div style="font-weight:700;margin-bottom:6px">Logged in as ${esc(S.me.name || '')}</div>
    <label style="margin-top:4px">Your name (shown in the app and your emails)</label>
    <div style="display:flex;gap:8px"><input id="aName" value="${esc(S.me.name || '')}" maxlength="40"><button class="btn primary" onclick="saveName()">Save</button></div>
    <div class="small muted">Change the username and password you use to open this app. Other devices will be logged out.</div>
    <label>Current password</label><input id="aCur" type="password" autocomplete="current-password">
    <label>New username</label><input id="aUser" autocomplete="username" placeholder="Leave blank to keep the same">
    <label>New password</label><input id="aNew" type="password" autocomplete="new-password" placeholder="At least 6 characters">
    <button class="btn primary block" style="margin-top:14px" onclick="changeLogin()">Update login</button>
    <button class="btn danger block" style="margin-top:8px" onclick="logout()">Log out</button>
  </div>
  <h3>Your data</h3>
  <div class="card small">Everything is saved in a Google Sheet you own — you can open it anytime to view, sort or export.<br><br>
    ${S.sheetUrl ? `<a href="${esc(S.sheetUrl)}" target="_blank">Open the spreadsheet ↗</a>` : ''}</div>
  <div class="card small muted">💡 Tip: on your phone, open this page and choose <b>Add to Home Screen</b> to use it like an app.</div>`;
}
function saveSettings() {
  const s = {currency: val('sCur').trim() || '$', income: String(num(val('sInc'))), reminderDays: val('sDays'),
    emailReminders: String(chk('sEmail')), email: val('sMail').trim(), reminderHour: val('sHour'), skipAutopayReminders: String(chk('sSkipAuto'))};
  mutate('saveSettings', [s], () => Object.assign(S.settings, s));
  toast(s.emailReminders === 'true' ? '✅ Saved — reminders are on' : '✅ Settings saved');
}
function saveCats(list) { const v = JSON.stringify(list); mutate('saveSettings', [{categories: v}], () => { S.settings.categories = v; }); }
function addCat() {
  const v = val('newCat').trim(); if (!v) return;
  if (savedCats().some(c => c.toLowerCase() === v.toLowerCase())) return toast('Already in your list');
  saveCats(savedCats().concat(v)); toast('Category added');
}
function removeCat(i) { const l = savedCats(), name = l[i]; l.splice(i, 1); saveCats(l); toast(`Removed “${name}”`, 'Undo', () => { const u = savedCats(); u.splice(i, 0, name); saveCats(u); }); }
function peopleCard() {
  return `<h3>People</h3>
  <div class="card">
    <div class="small muted" style="margin-bottom:6px">Everyone sees household bills. Each person also has their own “Just me” bills and paychecks.</div>
    ${S.people.map(p => `<div class="person"><div class="avatar">${esc((p.name || '?')[0].toUpperCase())}</div>
      <div class="info"><b>${esc(p.name)}</b>${p.admin ? ' <span class="badge">Admin</span>' : ''}<div class="small muted">@${esc(p.username || '')}</div></div>
      ${p.id === S.me.id ? '' : `<button class="btn ghost" style="padding:8px 10px;font-size:13px" onclick="openPerson('${p.id}')">Manage</button>`}</div>`).join('')}
    <button class="btn primary block" style="margin-top:12px" onclick="openPerson()">+ Add a person</button>
  </div>`;
}
function openPerson(id) {
  if (id) {
    const p = S.people.find(x => x.id === id);
    return modal(`<h2>${esc(p.name)}</h2><div class="muted">@${esc(p.username)}</div>
      <label>Set a new password for them</label><input id="ppNew" type="text" autocomplete="off" placeholder="At least 6 characters">
      <button class="btn primary block" style="margin-top:12px" onclick="resetPerson('${id}')">Reset password</button>
      <button class="btn danger block" style="margin-top:8px" onclick="removePerson('${id}')">Remove ${esc(p.name)}'s login</button>
      <div class="small muted" style="margin-top:8px">Removing a login keeps their data in the sheet, but they can't log in anymore.</div>
      <div class="row"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  }
  modal(`<h2>Add a person</h2><div class="muted">They'll log in with their own username and password.</div>
    <label>Name</label><input id="ppName" placeholder="e.g. Sarah">
    <label>Username</label><input id="ppUser" autocapitalize="none" autocorrect="off" placeholder="What they'll type to log in">
    <label>Password</label><input id="ppPass" type="text" autocomplete="off" placeholder="At least 6 characters — they can change it">
    <label>Their email (for reminders, optional)</label><input id="ppMail" type="email">
    <div class="row"><button class="btn ghost" onclick="goBack()">Cancel</button><button class="btn primary" onclick="addPerson()">Add</button></div>`);
}
function addPerson() {
  const name = val('ppName').trim(), user = val('ppUser').trim(), pass = val('ppPass'), mail = val('ppMail').trim();
  if (!name || !user || pass.length < 6) return toast('Fill in name, username and a 6+ character password');
  closeModal(); toast('Adding…');
  run('addPerson', name, user, pass, mail).then(d => { apply(d); toast(`✅ ${name} can now log in as “${user}”`); })
    .catch(e => { if (!e.auth) toast('⚠️ ' + (e.message || e)); });
}
function resetPerson(id) {
  const pw = val('ppNew'); if (pw.length < 6) return toast('Password must be at least 6 characters');
  closeModal(); run('resetPersonPassword', id, pw).then(d => { apply(d); toast('✅ Password reset'); }).catch(e => { if (!e.auth) toast('⚠️ ' + (e.message || e)); });
}
function removePerson(id) {
  NEXT_BACK = () => openPerson(id);
  const p = S.people.find(x => x.id === id);
  modal(`<h2>Remove ${esc(p.name)}?</h2><p class="muted">They won't be able to log in. Household bills aren't affected.</p>
    <div class="row"><button class="btn ghost" onclick="openPerson('${id}')">Cancel</button><button class="btn danger" onclick="doRemovePerson('${id}')">Remove</button></div>`);
}
function doRemovePerson(id) { closeModal(); mutate('removePerson', [id]); toast('Removed'); }
function saveName() {
  const n = val('aName').trim(); if (!n) return toast('Enter a name');
  mutate('saveSettings', [{name: n}], () => { S.me.name = n; const p = S.people.find(x => x.id === S.me.id); if (p) p.name = n; });
  toast('✅ Name saved');
}
function changeLogin() {
  const cur = val('aCur'), user = val('aUser').trim(), np = val('aNew');
  if (!cur || !np) return toast('Enter your current and new password');
  toast('Updating…');
  run('changeLogin', cur, user, np).then(t => { TOKEN = t; store.clear(); store.set(t, true); toast('✅ Login updated'); render(); })
    .catch(e => { if (!e.auth) toast('⚠️ ' + (e.message || e)); });
}
function logout() {
  const t = TOKEN; store.clear(); TOKEN = null;
  gs('logout', t).catch(() => {});
  S = Object.assign(S, {bills: [], payments: [], paychecks: []});
  showLogin('You\'re logged out.');
}
function showLogin(msg) {
  closeModal();
  $('loading').style.display = 'none'; $('nav').innerHTML = ''; $('nav').style.display = 'none'; $('fab').style.display = 'none';
  $('app').innerHTML = `<form class="login" onsubmit="event.preventDefault();doLogin()">
    <div class="logo">🧾</div><h1>Bill Tracker</h1><div class="sub2">${esc(msg || 'Log in to see your bills')}</div>
    <label>Username</label><input id="lUser" autocomplete="username" autocapitalize="none" autocorrect="off" required>
    <label>Password</label><input id="lPass" type="password" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" id="lKeep" checked> Keep me logged in on this device</label>
    <button class="btn primary block" id="lBtn" type="submit">Log in</button>
    <div id="lErr"></div></form>`;
}
function doLogin() {
  const btn = $('lBtn'); btn.disabled = true; btn.textContent = 'Logging in…'; $('lErr').innerHTML = '';
  gs('login', val('lUser'), val('lPass')).then(t => {
    TOKEN = t; store.set(t, chk('lKeep'));
    $('nav').style.display = ''; $('app').innerHTML = ''; $('loading').style.display = 'flex'; load();
  }).catch(e => { btn.disabled = false; btn.textContent = 'Log in'; $('lErr').innerHTML = `<div class="err">${esc(e.message || e)}</div>`; });
}
function testEmail() { toast('Sending…'); run('sendTestReminder').then(m => toast(m)).catch(e => toast('⚠️ ' + (e.message || e))); }

/* ============ Modal (with ‹ Back + swipe right) & toast ============ */
let MODAL_BACK = null, DETAIL = null, DETAIL_KEY = null, NEXT_BACK = null, NEXT_ANIM = '';
// If a bill's detail sheet is open, sub-screens (pay, edit, balance) go "back" to it.
function backTo(id) { const k = DETAIL_KEY; NEXT_BACK = (id && DETAIL === id && $('overlay')) ? () => openDetail(id, k) : null; }

function modal(html) {
  const back = NEXT_BACK; NEXT_BACK = null;
  closeModal(true);
  MODAL_BACK = back;
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="sheet"><button class="backbtn" onclick="goBack()" aria-label="Back"><b>‹</b> Back</button>${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeModal(); });
  const sheet = o.firstChild;
  if (NEXT_ANIM === 'left') sheet.style.animation = 'inl .25s cubic-bezier(.2,.8,.2,1)';
  NEXT_ANIM = '';
  enableSwipe(sheet);
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
}
function closeModal(keep) {
  const o = $('overlay'); if (o) o.remove();
  document.body.style.overflow = '';
  if (!keep) { MODAL_BACK = null; DETAIL = null; DETAIL_KEY = null; }
}
function goBack() {
  const b = MODAL_BACK;
  if (b) { NEXT_ANIM = 'left'; b(); } else closeModal();
}
function enableSwipe(sheet) {
  // Swipe right = back one step. Pull down (from the top of the panel) = close.
  let x0 = null, y0 = 0, dx = 0, dy = 0, dir = null, startTop = 0;
  sheet.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || e.target.closest('textarea,select,.chips,.catpick,.chart')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = dy = 0; dir = null; startTop = sheet.scrollTop;
    sheet.style.transition = 'none';
  }, {passive: true});
  sheet.addEventListener('touchmove', e => {
    if (x0 === null) return;
    const ddx = e.touches[0].clientX - x0, ddy = e.touches[0].clientY - y0;
    if (dir === null && (Math.abs(ddx) > 10 || Math.abs(ddy) > 10)) {
      if (ddx > 0 && Math.abs(ddx) > Math.abs(ddy) * 1.2) dir = 'x';
      else if (ddy > 0 && Math.abs(ddy) > Math.abs(ddx) && startTop <= 0 && sheet.scrollTop <= 0) dir = 'y';
      else dir = false;
    }
    if (!dir) return;
    e.preventDefault();
    if (dir === 'x') { dx = Math.max(0, ddx); sheet.style.transform = `translateX(${dx}px)`; sheet.style.opacity = String(Math.max(.3, 1 - dx / 500)); }
    else { dy = Math.max(0, ddy); sheet.style.transform = `translateY(${dy}px)`; }
  }, {passive: false});
  sheet.addEventListener('touchend', () => {
    if (x0 === null || !dir) { x0 = null; return; }
    x0 = null;
    sheet.style.transition = 'transform .22s ease, opacity .22s ease';
    if (dir === 'x' && dx > 80) { sheet.style.transform = 'translateX(110%)'; sheet.style.opacity = '0'; setTimeout(goBack, 170); }
    else if (dir === 'y' && dy > 100) {
      sheet.style.transform = 'translateY(100%)';
      const o = $('overlay'); if (o) { o.style.transition = 'opacity .22s'; o.style.opacity = '0'; }
      setTimeout(() => closeModal(), 200);
    }
    else { sheet.style.transform = ''; sheet.style.opacity = ''; }
  });
}
let toastTimer;
function toast(msg, label, fn, label2, fn2) {
  const old = document.querySelector('.toast'); if (old) old.remove(); clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>`;
  [[label2, fn2], [label, fn]].forEach(([l, f]) => {
    if (!l) return;
    const b = document.createElement('button'); b.textContent = l; b.onclick = () => { t.remove(); f(); }; t.appendChild(b);
  });
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), label2 ? 6000 : label ? 5000 : 2500);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('overlay')) goBack(); });

if (TOKEN) load(); else showLogin();
</script>
